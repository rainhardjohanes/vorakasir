<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src https://pjycdyrwdcjhxmdjzxto.supabase.co; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Lupa password · VORA POS</title>
  <link rel="icon" href="./dashboard-assets-vora-app-icon.png" type="image/png">
  <link rel="stylesheet" href="./reset-password.css">
  <script type="module" src="./forgot-password.js"></script>
</head>
<body>
  <main class="recovery-card" aria-labelledby="page-title">
    <div class="brand"><img src="./vora-logo.png" alt="VORA POS" width="1774" height="887"></div>
    <p class="eyebrow">PEMULIHAN AKUN</p>
    <h1 id="page-title">Lupa password?</h1>
    <p class="intro">Masukkan email akun VORA POS Anda. Kami akan mengirimkan tautan untuk membuat password baru.</p>
    <div id="feedback" role="status" aria-live="polite" tabindex="-1" hidden></div>
    <form id="forgot-form" novalidate>
      <label for="email">Email akun</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
      <button id="send-reset" type="submit" class="primary">Kirim tautan reset</button>
    </form>
    <p class="note">Gunakan email yang sama dengan aplikasi kasir. Perubahan password akun tidak mengubah PIN staf.</p>
    <p class="note"><a href="https://vorakasir.com/dashboard/">Kembali ke halaman login</a></p>
    <p class="footer">VORA POS · Akses akun Anda dengan aman</p>
    <noscript><p class="notice error">Aktifkan JavaScript untuk meminta tautan reset password.</p></noscript>
  </main>
</body>
</html>
